[project]
name = "rag-enterprise-kb-assistant"
version = "0.1.0"
description = "RAG-based Enterprise Knowledge Base Q&A Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=5.0,<6",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "chromadb>=0.5",
    "litellm>=1.60",
    "pydantic>=2.9",
    "tqdm>=4.66",
    "tenacity>=9.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
]

[tool.uv]
package = false
